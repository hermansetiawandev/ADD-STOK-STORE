<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Scanner Barang</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
}

#reader {
    width: 100%;
}

#hasil {
    margin-top: 20px;
    padding: 15px;
    background: #eeeeee;
    border-radius: 10px;
    font-size: 18px;
}

.input-qty {

    display: none;

    margin-top: 20px;

}

input {

    width: 90%;
    padding: 15px;

    font-size: 20px;

    text-align: center;

    border-radius: 10px;

    border: 1px solid #ccc;

}

button {

    margin-top: 15px;

    width: 90%;

    padding: 15px;

    border: none;

    border-radius: 10px;

    font-size: 18px;

    cursor: pointer;

}

.btn-simpan {

    background: #28a745;

    color: white;

}

.success {

    background: #c8f7c5 !important;

    color: green;

}

</style>

</head>

<body>


<div class="container">

<h2>SCAN BARANG</h2>


<div id="reader"></div>


<div id="hasil">

Silakan scan barcode

</div>


<div class="input-qty" id="qtyBox">

<h3>Masukkan Jumlah Barang</h3>

<input
type="number"
id="qty"
placeholder="Masukkan QTY"
min="1"
>


<button
class="btn-simpan"
onclick="simpanData()"
>

SIMPAN

</button>

</div>


</div>


<script>


// ================================
// MASUKKAN URL APPS SCRIPT
// ================================

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzyXpHwrWotMPfj6k6GFChrbN1b2wzhiawbsm3JjBcfqCboCAI7DJtq_sJy6r-pnhyo2A/exec";


let barcodeTerakhir = "";

let scannerAktif = true;



// ================================
// SAAT BARCODE BERHASIL DISCAN
// ================================

function onScanSuccess(decodedText) {

    if (!scannerAktif) return;


    scannerAktif = false;


    barcodeTerakhir = decodedText;


    document.getElementById("hasil").innerHTML =

        "Barcode Terdeteksi:<br><br>" +

        "<b>" + decodedText + "</b>";


    // Tampilkan input QTY

    document
    .getElementById("qtyBox")
    .style
    .display = "block";


    // Fokus ke input QTY

    setTimeout(() => {

        document
        .getElementById("qty")
        .focus();

    }, 300);


}



// ================================
// SIMPAN DATA
// ================================

function simpanData() {


    const qty = document
        .getElementById("qty")
        .value;


    if (!qty || qty <= 0) {

        alert("Masukkan QTY terlebih dahulu");

        return;

    }


    document
    .getElementById("hasil")
    .innerHTML =

        "Menyimpan data...";


    fetch(

        SCRIPT_URL,

        {

            method: "POST",

            body: JSON.stringify({

                barcode: barcodeTerakhir,

                qty: qty

            })

        }

    )

    .then(response => response.json())

    .then(data => {


        if (data.status === "success") {


            document
            .getElementById("hasil")
            .classList
            .add("success");


            document
            .getElementById("hasil")
            .innerHTML =

                "✓ DATA BERHASIL DISIMPAN<br><br>" +

                "Barcode: " +

                barcodeTerakhir +

                "<br>" +

                "QTY: " +

                qty;


            // Sembunyikan QTY

            document
            .getElementById("qtyBox")
            .style
            .display = "none";


            // Kosongkan input

            document
            .getElementById("qty")
            .value = "";


            // Setelah 2 detik siap scan lagi

            setTimeout(() => {


                scannerAktif = true;


                document
                .getElementById("hasil")
                .classList
                .remove("success");


                document
                .getElementById("hasil")
                .innerHTML =

                    "Silakan scan barcode berikutnya";


            }, 2000);


        }


    })


    .catch(error => {


        alert(

            "Terjadi kesalahan: " +

            error

        );


        scannerAktif = true;


    });


}




// ================================
// AKTIFKAN KAMERA
// ================================

const html5QrCode = new Html5Qrcode("reader");


html5QrCode.start(

    {

        facingMode: "environment"

    },

    {

        fps: 10,

        qrbox: {

            width: 250,

            height: 150

        }

    },

    onScanSuccess

)

.catch(err => {

    document
    .getElementById("hasil")
    .innerHTML =

        "Kamera tidak dapat dibuka";

});


</script>


</body>

</html>
